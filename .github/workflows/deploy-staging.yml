name: Deploy (Staging)

on:
  workflow_dispatch:
  push:
    branches:
      - staging
  repository_dispatch:
    # Fired by sanjeev-ai/swarmkit/keystar's sync-docs workflows after they
    # write new content to docs-portal-staging's Firestore. This is a
    # static export — new content isn't visible until a rebuild happens,
    # and nothing else triggers one, so this is the mechanism that keeps
    # the live site from going stale after a content-only sync.
    types: [docs-synced-staging]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      # repository_dispatch events have no natural ref, so actions/checkout
      # defaults to this repo's default branch (main) — wrong for this
      # workflow. Force staging explicitly; harmless for the push/
      # workflow_dispatch triggers since they're already on staging.
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Build frontend
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCS_PORTAL_STAGING }}' > /tmp/sa.json
          npm install
          # Next.js only auto-loads .env.production for `next build`; copy the
          # staging config over .env.production.local (highest precedence,
          # never committed) so this build gets staging's Firebase project.
          cp .env.staging .env.production.local
          npm run build
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: docs-portal-staging

      - name: Build functions
        run: cd functions && npm ci && npm run build

      - name: Deploy to Firebase (Hosting, Firestore rules, Functions)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCS_PORTAL_STAGING }}' > /tmp/sa.json
          npx -y firebase-tools@latest deploy \
            --only hosting,firestore:rules,functions \
            --project staging --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
