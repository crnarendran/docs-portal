name: Deploy (Prod)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  repository_dispatch:
    # Fired by sanjeev-ai/swarmkit/keystar's sync-docs workflows after they
    # write new content to docs-portal-prod's Firestore. See
    # deploy-staging.yml for why this exists.
    types: [docs-synced-prod]

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      # main is this repo's default branch, so this is already correct for
      # repository_dispatch's ref-less events, but pin it explicitly so
      # that stays true even if the default branch ever changes.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build frontend
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCS_PORTAL_PROD }}' > /tmp/sa.json
          npm install
          npm run build
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: docs-portal-prod

      - name: Build functions
        run: cd functions && npm install && npm run build

      - name: Deploy to Firebase (Hosting, Firestore rules, Functions)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCS_PORTAL_PROD }}' > /tmp/sa.json
          npx -y firebase-tools@latest deploy \
            --only hosting,firestore:rules,functions \
            --project production --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
